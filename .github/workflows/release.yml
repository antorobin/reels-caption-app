# Cuts a GitHub Release on a version tag: the slim installer, the runtime
# component packs it downloads at first run, and (for air-gapped users)
# the fully-bundled installer.
#
# Flow:
#   slim        -> tauri-action builds the ~6 MB MSI (default tauri.conf.json
#                  bundles app + fonts only), signs it, CREATES the release,
#                  uploads the MSI + latest.json for the OTA updater.
#   components  -> builds the Python envs + a librubberband-capable ffmpeg +
#                  the LLM pack, runs pack-components.mjs (tarballs + SHA-256
#                  + a filled components.json pinned to THIS release's tag),
#                  uploads them all. runtime_fetch.rs fetches these.
#   full        -> the same app bundled with the whole runtime, uploaded as
#                  KraftReel-Full-<tag>-x64.msi.
#
# Windows-only for now: the component packs are win-x64. macOS/Linux slim
# installers need their own packs -- a follow-up.
#
# One-time repo secrets (Settings -> Secrets and variables -> Actions),
# same as before -- the signing key stays out of the repo by design:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the tauri signer key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  only if the key has a password
#
# Cut a release: bump `version` in src-tauri/tauri.conf.json + package.json,
# commit, then `git tag v0.3.0 && git push origin v0.3.0`.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # components.json points here so it's pinned to this exact release, not
  # whatever /latest/ resolves to mid-rollout.
  RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------- slim --
  slim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # No `fetch-resources` here -- the slim installer bundles nothing
      # heavy. The default tauri.conf.json's bundle.resources is just fonts.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "KraftReel.App ${{ github.ref_name }}"
          releaseBody: |
            Slim installer (~6 MB) — the speech/media runtime downloads on first launch.
            KraftReel-Full-*.msi bundles everything for offline installs.
            Installed copies update themselves via latest.json.
          releaseDraft: false
          prerelease: false
          args: --bundles msi

  # ---------------------------------------------------------- components --
  components:
    runs-on: windows-latest
    needs: slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # LLM (llama.cpp + Qwen gguf) and the Piper voices come from the
      # existing dev-resources archive; ffmpeg from it too, then overwritten.
      - name: Fetch LLM + Piper resources
        run: npm run fetch-resources

      # A real prebuilt ffmpeg that includes librubberband (tts.rs's
      # emotion pitch-shift needs it) + libass + libx264 -- stock
      # gyan.dev/BtbN "essentials" builds omit rubberband. ~90 MB static,
      # vs the 242 MB full build fetch-resources ships. A from-source
      # --disable-everything build (docs/MINIMAL-FFMPEG.md) can shave it
      # further later.
      - name: Swap in a librubberband ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x ff.zip -off >/dev/null
          d=$(find ff -maxdepth 1 -type d -name 'ffmpeg-*')
          cp "$d/bin/ffmpeg.exe" "$d/bin/ffprobe.exe" src-tauri/resources/bin/
          ./src-tauri/resources/bin/ffmpeg.exe -hide_banner -filters | grep -E 'rubberband|ass ' || (echo "ffmpeg missing a required filter" && exit 1)

      - name: Build the Python runtime envs
        run: node scripts/build-python-runtime.mjs --pack=all

      - name: Pack components
        run: node scripts/pack-components.mjs --out dist/components --version ${{ github.ref_name }} --release-base ${{ env.RELEASE_BASE }}

      # Archives first, then the manifest -- so a client that reads
      # components.json never points at an asset that isn't up yet.
      - name: Upload component archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" dist/components/*.tar.gz --clobber
          gh release upload "${{ github.ref_name }}" dist/components/components.json --clobber

  # --------------------------------------------------------------- full --
  full:
    runs-on: windows-latest
    needs: slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Fetch bundled ffmpeg/LLM/Piper resources
        run: npm run fetch-resources
      - name: Build the Python runtime envs
        run: node scripts/build-python-runtime.mjs --pack=all

      - name: Build the full installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:full

      - name: Upload the full installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src=$(find src-tauri/target/release/bundle/msi -name '*_x64_en-US.msi' | head -1)
          dst="KraftReel-Full-${{ github.ref_name }}-x64.msi"
          cp "$src" "$dst"
          gh release upload "${{ github.ref_name }}" "$dst" --clobber
