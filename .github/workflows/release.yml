# Cuts a GitHub Release on a version tag: the slim installer for each OS,
# the runtime component packs it downloads at first run, and (for
# air-gapped users) the fully-bundled Windows installer.
#
# Flow:
#   slim        -> tauri-action builds the small installer per OS (default
#                  tauri.conf.json bundles app + fonts only), signs it,
#                  CREATES the release, uploads the installer + latest.json.
#   components  -> builds the Python envs + a librubberband ffmpeg + the
#                  LLM pack, runs pack-components.mjs (tarballs + SHA-256 +
#                  a components.json with URLs pinned to THIS tag), uploads
#                  them. runtime_fetch.rs fetches these. Windows-x64 only
#                  for now; the manifest / resolver already key on
#                  platform, so macos/linux legs slot in later.
#   full        -> the Windows app bundled with the whole runtime, uploaded
#                  as KraftReel-Full-<tag>-x64.msi.
#
# One-time repo secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the tauri signer key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  only if the key has a password
#
# Cut a release: bump `version` in src-tauri/tauri.conf.json + package.json,
# commit, then `git tag v0.3.0 && git push origin v0.3.0`.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------- slim --
  slim:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
          - platform: macos-latest
            args: "--bundles dmg"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps (webview + tray + audio capture)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # No fetch-resources -- the slim installer bundles nothing heavy.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "KraftReel.App ${{ github.ref_name }}"
          releaseBody: |
            Slim installer — the speech/media runtime downloads on first launch.
            KraftReel-Full-*.msi bundles everything for offline installs (Windows).
            Installed copies update themselves via latest.json.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ---------------------------------------------------------- components --
  components:
    runs-on: windows-latest
    needs: slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # LLM (llama.cpp + Qwen gguf) and the Piper voices come from the
      # existing dev-resources archive.
      - name: Fetch LLM + Piper resources
        run: npm run fetch-resources

      # Prefer the trimmed static build from the ffmpeg-min workflow;
      # fall back to BtbN's ~90 MB win64-gpl (also has librubberband).
      - name: Provide a librubberband ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download ffmpeg-min --pattern 'ffmpeg-min-windows-x64.tar.gz' -O ffmin.tar.gz 2>/dev/null; then
            echo "using ffmpeg-min"
            tar -xzf ffmin.tar.gz -C src-tauri/resources/bin
          else
            echo "ffmpeg-min not published yet -- using BtbN win64-gpl"
            curl -fL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            7z x ff.zip -off >/dev/null
            d=$(find ff -maxdepth 1 -type d -name 'ffmpeg-*')
            cp "$d/bin/ffmpeg.exe" "$d/bin/ffprobe.exe" src-tauri/resources/bin/
          fi
          ./src-tauri/resources/bin/ffmpeg.exe -hide_banner -filters | grep -E ' rubberband| ass ' \
            || (echo "ffmpeg missing a required filter" && exit 1)

      - name: Build the Python runtime envs
        run: node scripts/build-python-runtime.mjs --pack=all

      - name: Pack components
        run: node scripts/pack-components.mjs --out dist/components --platform windows-x64 --version ${{ github.ref_name }} --release-base ${{ env.RELEASE_BASE }}

      # Archives first, then the manifest -- so a client that reads
      # components.json never points at an asset that isn't up yet.
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" dist/components/*.tar.gz --clobber
          gh release upload "${{ github.ref_name }}" dist/components/components.json --clobber

  # --------------------------------------------------------------- full --
  full:
    runs-on: windows-latest
    needs: slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Fetch bundled ffmpeg/LLM/Piper resources
        run: npm run fetch-resources
      - name: Build the Python runtime envs
        run: node scripts/build-python-runtime.mjs --pack=all

      - name: Build the full installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:full

      - name: Upload the full installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src=$(find src-tauri/target/release/bundle/msi -name '*_x64_en-US.msi' | head -1)
          dst="KraftReel-Full-${{ github.ref_name }}-x64.msi"
          cp "$src" "$dst"
          gh release upload "${{ github.ref_name }}" "$dst" --clobber
