<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KraftReel.App</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #17181c;
        color: #e8e8ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        width: 100%;
        height: 100%;
      }

      .logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }

      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--shell-text, #e8e8ea);
      }

      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #34363c;
        border-top-color: #3b82f6;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img class="logo" src="/logo.png" alt="KraftReel.App" />
      <div class="spinner"></div>
      <div class="title">Loading…</div>
    </div>
  </body>
</html>
