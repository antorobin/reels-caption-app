[package]
name = "reels-caption-app"
version = "0.1.0"
description = "Local-first Reels caption tool - hello world scaffold"
authors = ["you"]
edition = "2021"

# Normally ["staticlib", "cdylib", "rlib"] so the same crate builds for
# desktop AND mobile (iOS needs staticlib, Android needs cdylib). Narrowed
# to "rlib" here because building on the x86_64-pc-windows-gnu target (no
# MSVC Build Tools in this environment) hits a known upstream limitation:
# rustc's cdylib output on -windows-gnu auto-exports every `pub` symbol,
# and Tauri's dependency tree produces ~92,700 of them — over the PE
# format's hard 65,535-export limit. This is specific to GNU-on-Windows;
# it doesn't happen on MSVC or on macOS/Linux (ELF/Mach-O have no such
# limit), so it won't affect real iOS/Android builds. Restore
# ["staticlib", "cdylib", "rlib"] before cross-compiling for iOS/Android,
# or when building on this project with the MSVC toolchain instead.
[lib]
name = "reels_caption_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[target.'cfg(windows)'.dependencies]
# Ensures ffmpeg/stt/media-ai/llama-server child processes die with the app instead
# of becoming orphaned zombies — see proc_cleanup.rs. A Windows Job Object
# with KILL_ON_JOB_CLOSE, assigned to this process itself; by default (no
# breakaway flags set) every process this app spawns at any depth
# automatically inherits job membership too, so this needs no changes at
# any individual subprocess call site.
win32job = "2"

[dependencies]
# "tray-icon": lets the app live in the system tray (see tray.rs) — core
# Tauri functionality gated behind this feature flag in v2, not a
# separate plugin the way it was in v1.
tauri = { version = "2.0.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-notification = "2"
# Checks a static `latest.json` manifest (see tauri.conf.json's
# `plugins.updater`) hosted as a GitHub Release asset -- same free,
# already-used-by-this-project hosting as the MSI/dev-resources archives,
# no separate update server needed. Every downloaded update is verified
# against the public key baked into tauri.conf.json before installing;
# the matching private key never ships anywhere, see the README's "Over-
# the-air updates" section for the full signing story.
tauri-plugin-updater = "2"
# Restarts the app after an update installs -- the updater applies the new
# version to disk but doesn't relaunch the process itself.
tauri-plugin-process = "2"
# Opens the system browser to Meta's OAuth consent screen (see
# instagram.rs) -- the official Tauri v2 replacement for the old
# plugin-shell "open" functionality, scoped to just this one job.
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Minimal, sync, single-purpose local HTTP(S) server -- used for the
# OAuth loopback listener (instagram.rs) that catches Meta's redirect
# during sign-in, and (in a later phase) the temporary local file server
# behind a cloudflared tunnel for Instagram's media fetch. Deliberately
# not a full async web framework (axum/actix) for what's just "catch one
# request, serve one static file." "ssl-rustls" -- confirmed the hard
# way that Meta rejects a plain http:// OAuth redirect URI even for
# localhost (a real, longstanding policy, not specific to this app) --
# needed so the loopback listener can actually terminate the https://
# redirect Meta requires.
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
# Generates the self-signed localhost certificate the listener above
# presents -- nothing needs it to be *trusted* (it never leaves this
# machine), just present, so the browser can complete the final redirect
# hop. The browser will show a one-time "connection isn't private"
# interstitial for that hop; documented in instagram.rs and the README
# rather than something to design around.
rcgen = "0.13"
# Percent-encoding for the OAuth authorize URL's query params -- a
# single-file, zero-dependency crate, safer than hand-rolling this and
# missing an edge case that quietly breaks sign-in.
urlencoding = "2"
# Async subprocess handling for ffmpeg/stt engines, so long-running jobs
# don't block the webview's UI thread. Tauri already runs its own tokio
# runtime under the hood; this just lets our commands hook into it. "time"
# + "rt" added for the once-a-minute scheduler tick (scheduler.rs) and the
# container-processing poll loop / cloudflared-tunnel-URL wait
# (instagram.rs's publish flow, media_host.rs).
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt"] }
# Talks to the bundled llama-server.exe's local HTTP completion API (see
# llm.rs, plain http:// to 127.0.0.1 only) AND fetches optional model
# checkpoints from this repo's GitHub Release over HTTPS (see
# model_fetch.rs) -- "rustls-tls" over the default "native-tls" backend
# specifically to avoid depending on a system OpenSSL install, matching
# this project's general preference for self-contained builds. "stream"
# enables incremental (not fully-buffered) download writes for the
# ~360MB optional-models archive.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[features]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
